buildscript {
	repositories {
		mavenCentral()
		maven { url 'https://cdn.fox2code.com/maven' }
		maven { url 'https://jitpack.io/' }
	}
	dependencies {
		classpath 'com.fox2code.FoxLoader:dev:2.0-alpha34'
	}
}

apply plugin: 'foxloader.dev'

version '0.1.0'

foxloader {
	modId = 'chlorojoules'
	modName = 'ChloroJoules'
	modVersion = project.version
	modAuthors = 'Emily "TTG" Banerjee <prs.ttg+cj@pm.me>'
	modDesc = 'Flower power to the extreme!'
	modWebsite = 'https://chlorojoules.github.io/'
	modMain = 'io.github.chlorojoules.CJMod'
}
